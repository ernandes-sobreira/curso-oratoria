<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Curso — Oratória & Storytelling</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🎙️ Meu Curso — Oratória & Storytelling</h1>
  <p>Curso personalizado. Você é o aluno.</p>
</header>

<main class="container">

  <!-- PERFIL -->
  <section class="card">
    <h2>👤 Meu perfil</h2>
    <label>Nome</label>
    <input id="nameInput" placeholder="Seu nome">

    <label>Objetivo com o curso</label>
    <textarea id="goalInput" placeholder="Ex: Ser um palestrante claro e influente em clima e extensão"></textarea>

    <label>Foto (URL ou deixe vazio)</label>
    <input id="photoInput" placeholder="https://...">

    <button onclick="saveProfile()">Salvar perfil</button>

    <div id="profileView"></div>
  </section>

  <!-- TIMER -->
  <section class="card">
    <h2>⏱️ Tempo de estudo</h2>
    <div class="timer" id="timer">00:00:00</div>
    <button onclick="startTimer()">Iniciar</button>
    <button onclick="stopTimer()">Parar</button>
  </section>

  <!-- PROGRESSO -->
  <section class="card">
    <h2>📊 Progresso</h2>
    <progress id="progressBar" value="0" max="5"></progress>
    <p id="progressText">0 de 5 aulas concluídas</p>
  </section>

  <!-- AULAS -->
  <section class="card">
    <h2>📚 Aulas</h2>
    <div id="lessons"></div>
  </section>

  <!-- EXPORT -->
  <section class="card">
    <h2>💾 Backup</h2>
    <button onclick="exportData()">Exportar progresso</button>
    <input type="file" onchange="importData(event)">
  </section>

</main>

<footer>
  <p>Plataforma criada por mim com apoio do ChatGPT • 2026</p>
</footer>

<script src="app.js"></script>
</body>
</html>
